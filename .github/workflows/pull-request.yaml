name: Pull Request Checks
permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  install:
    name: Cache Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Install dependencies
        run: npm ci

  type:
    name: Type Check
    needs: [install]
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch dependencies cache
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: node-modules-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check
        run: npm run type-check

  lint:
    name: Lint Check
    needs: [install]
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch dependencies cache
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: node-modules-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint check
        run: npm run lint

  ts-format:
    name: TypeScript Format Check
    needs: [install]
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch dependencies cache
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: node-modules-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: TypeScript format check
        run: npm run format:check

  prisma-format:
    name: Prisma Format Check
    needs: [install]
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch dependencies cache
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: node-modules-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prisma format check
        run: npm run prisma:format:check
  
  schema:
    name: Schema Check
    needs: [install]
    runs-on: ubuntu-slim

    env:
      DATABASE_URL: postgresql://treeo2_user:treeo2_password@localhost:5432/treeo2?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch dependencies cache
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: node-modules-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Schema validate
        run: npm run prisma:validate

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [install, type, lint, ts-format, prisma-format, schema]
    timeout-minutes: 15

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://treeo2_user:treeo2_password@localhost:5432/treeo2?schema=public
      JWT_SECRET: test-secret-test-secret-test-secret-123456

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: treeo2_user
          POSTGRES_PASSWORD: treeo2_password
          POSTGRES_DB: treeo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U treeo2_user -d treeo2"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch dependencies cache
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: node-modules-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Setup test database
        run: npm run prisma:migrate:deploy

      - name: Test
        run: npm run test:coverage -- --runInBand
        env:
          PORT: 3000
          AUTH_DEV_MODE: true
          AUTH_DEV_ADMIN_TOKEN: dev-admin-token
          AUTH_DEV_MANAGER_TOKEN: dev-manager-token
          AUTH_DEV_INSPECTOR_TOKEN: dev-inspector-token
          AUTH_DEV_FARMER_TOKEN: dev-farmer-token
          AUTH_DEV_DEVELOPER_TOKEN: dev-developer-token
          AUTH_DEV_ORG_ADMIN_TOKEN: dev-org-admin-token
          AUTH_DEV_SUPPORT_ADMIN_TOKEN: dev-support-admin-token

      - name: Build
        run: npm run build